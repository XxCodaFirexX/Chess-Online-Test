<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Glide Chess - Professional Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0-beta.8/chess.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --light: #dee3e6; --dark: #8ca2ad; --select: #f5f682; --last-move: #f6f669; }
        body { background: #262421; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .game-container { display: flex; gap: 20px; align-items: flex-start; }
        .board { display: grid; grid-template-columns: repeat(8, 70px); grid-template-rows: repeat(8, 70px); border: 5px solid #312e2b; box-shadow: 0 10px 50px rgba(0,0,0,0.7); }
        .square { width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .white-sq { background-color: var(--light); }
        .black-sq { background-color: var(--dark); }
        .square img { width: 90%; height: 90%; user-select: none; pointer-events: none; transition: transform 0.1s ease; }
        .selected { background-color: var(--select) !important; }
        .last-move { background-color: var(--last-move) !important; opacity: 0.8; }
        .info-panel { width: 250px; background: #312e2b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #81b64c; font-size: 1.5rem; }
        #status { font-weight: bold; margin-bottom: 15px; color: #bababa; }
        .btn-reset { background: #81b64c; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-reset:hover { background: #a3d160; }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="board" class="board"></div>
        
        <div class="info-panel">
            <h1>Pro Glide</h1>
            <div id="role-text">Waiting for connection...</div>
            <hr style="border: 0.5px solid #444;">
            <div id="status">White's Turn</div>
            <button class="btn-reset" onclick="location.reload()">New Game</button>
        </div>
    </div>

    <script>
        const socket = io();
        const chess = new Chess();
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const roleEl = document.getElementById('role-text');

        let playerRole = null;
        let selectedSquare = null;

        // Piece Image Mapping
        const pieceImages = {
            'wP': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
            'wR': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
            'wN': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
            'wB': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
            'wQ': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
            'wK': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
            'bP': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
            'bR': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
            'bN': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
            'bB': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
            'bQ': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
            'bK': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        };

        function renderBoard() {
            const board = chess.board();
            boardEl.innerHTML = '';
            
            // Generate board based on perspective
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const row = playerRole === 'black' ? 7 - r : r;
                    const col = playerRole === 'black' ? 7 - c : c;
                    const square = board[row][col];

                    const squareEl = document.createElement('div');
                    squareEl.classList.add('square');
                    squareEl.classList.add((row + col) % 2 === 0 ? 'white-sq' : 'black-sq');

                    const squareId = String.fromCharCode(97 + col) + (8 - row);
                    
                    if (square) {
                        const img = document.createElement('img');
                        img.src = pieceImages[square.color + square.type.toUpperCase()];
                        squareEl.appendChild(img);
                    }

                    if (selectedSquare === squareId) squareEl.classList.add('selected');

                    squareEl.onclick = () => handleSquareClick(squareId);
                    boardEl.appendChild(squareEl);
                }
            }
        }

        function handleSquareClick(squareId) {
            if (playerRole === 'spectator') return;
            if (chess.turn() !== playerRole[0]) return;

            if (selectedSquare) {
                const move = { from: selectedSquare, to: squareId, promotion: 'q' };
                const result = chess.move(move);

                if (result) {
                    socket.emit('move', move);
                    selectedSquare = null;
                    updateStatus();
                    renderBoard();
                } else {
                    selectedSquare = (chess.get(squareId)?.color === playerRole[0]) ? squareId : null;
                    renderBoard();
                }
            } else {
                if (chess.get(squareId)?.color === playerRole[0]) {
                    selectedSquare = squareId;
                    renderBoard();
                }
            }
        }

        function updateStatus() {
            let status = "";
            if (chess.in_checkmate()) status = "Checkmate! " + (chess.turn() === 'w' ? "Black" : "White") + " wins.";
            else if (chess.in_draw()) status = "Draw Game!";
            else if (chess.in_check()) status = (chess.turn() === 'w' ? "White" : "Black") + " is in Check!";
            else status = (chess.turn() === 'w' ? "White" : "Black") + "'s Turn";
            
            statusEl.innerText = status;
        }

        socket.on('playerRole', (role) => {
            playerRole = role;
            roleEl.innerText = role === 'spectator' ? "Room Full: Spectating" : "Playing as: " + role.toUpperCase();
            renderBoard();
        });

        socket.on('move', (move) => {
            chess.move(move);
            updateStatus();
            renderBoard();
        });

        renderBoard();
    </script>
</body>
</html>
